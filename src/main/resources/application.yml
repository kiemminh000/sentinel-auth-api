spring:
  application:
    name: sentinel-auth-api
  config:
    import: optional:file:.env[.properties] 
  datasource:
    url: jdbc:postgresql://localhost:5432/sentinel_db
    username: postgres
    password: ${DB_PASSWORD} 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true